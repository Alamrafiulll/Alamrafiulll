<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="30">
  <defs>
    <filter id="glowDivider" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="divGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0" />
      <stop offset="80%" stop-color="#00ff41" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="20%" stop-color="#00ff41" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Central Diamond Core -->
  <polygon points="425,5 435,15 425,25 415,15" fill="#00f0ff" filter="url(#glowDivider)" />
  <polygon points="425,8 432,15 425,22 418,15" fill="#05080c" />
  <circle cx="425" cy="15" r="3" fill="#00ff41" filter="url(#glowDivider)" />

  <!-- Left Lines -->
  <line x1="50" y1="15" x2="405" y2="15" stroke="url(#divGradLeft)" stroke-width="1.5" />
  <line x1="250" y1="11" x2="395" y2="11" stroke="#00ff41" stroke-width="0.8" stroke-dasharray="8,4" opacity="0.6" />
  <circle cx="240" cy="15" r="2" fill="#00ff41" />
  <circle cx="150" cy="15" r="1.5" fill="#00f0ff" opacity="0.7" />

  <!-- Right Lines -->
  <line x1="445" y1="15" x2="800" y2="15" stroke="url(#divGradRight)" stroke-width="1.5" />
  <line x1="455" y1="19" x2="600" y2="19" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8,4" opacity="0.6" />
  <circle cx="610" cy="15" r="2" fill="#00f0ff" />
  <circle cx="700" cy="15" r="1.5" fill="#00ff41" opacity="0.7" />
</svg>
