<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Contribution activity grid</title>
  <desc id="desc">A GitHub-inspired contribution grid with neon green activity squares and subtle pixel bursts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a08" />
      <stop offset="1" stop-color="#07100c" />
    </linearGradient>
    <pattern id="emptyGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="10" height="10" rx="2" fill="#161b22" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .low { fill: #0e4429; } .mid { fill: #006d32; } .high { fill: #00a843; } .hot { fill: #00ff66; filter: url(#glow); }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-delay { animation: pulse 2.2s .65s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-late { animation: pulse 2.2s 1.25s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .burst { animation: burst 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .burst-delay { animation: burst 2.2s 1.1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.9); } 45% { opacity: 1; transform: scale(1.18); } }
      @keyframes burst { 0%,35% { opacity: 0; transform: scale(.35); } 48% { opacity: .9; } 100% { opacity: 0; transform: scale(1.8); } }
    </style>
  </defs>

  <rect x="5" y="5" width="950" height="260" rx="9" fill="url(#background)" stroke="#00ff66" stroke-opacity=".55" />
  <path d="M22 42H938M22 232H938" stroke="#00e5ff" stroke-opacity=".3" />
  <text x="28" y="31" class="mono" font-size="13" font-weight="700" fill="#00ff66">CONTRIBUTION_ACTIVITY // SIGNAL_MAP</text>
  <text x="760" y="31" class="mono" font-size="11" fill="#00e5ff">BUILD. SHIP. REPEAT.</text>

  <g class="mono" font-size="10" fill="#9ee6d1">
    <text x="76" y="69">JAN</text><text x="226" y="69">MAR</text><text x="376" y="69">MAY</text><text x="526" y="69">JUL</text><text x="676" y="69">SEP</text><text x="826" y="69">NOV</text>
    <text x="27" y="96">MON</text><text x="27" y="126">WED</text><text x="27" y="156">FRI</text>
  </g>

  <rect x="75" y="78" width="780" height="105" fill="url(#emptyGrid)" />

  <g>
    <rect x="135" y="93" width="10" height="10" rx="2" class="low" /><rect x="150" y="108" width="10" height="10" rx="2" class="mid" />
    <rect x="195" y="123" width="10" height="10" rx="2" class="mid" /><rect x="210" y="93" width="10" height="10" rx="2" class="high" />
    <rect x="225" y="108" width="10" height="10" rx="2" class="low" /><rect x="240" y="138" width="10" height="10" rx="2" class="mid" />
    <rect x="270" y="123" width="10" height="10" rx="2" class="high" /><rect x="285" y="108" width="10" height="10" rx="2" class="mid" />
    <rect x="300" y="93" width="10" height="10" rx="2" class="low" /><rect x="315" y="138" width="10" height="10" rx="2" class="high" />
    <rect x="330" y="123" width="10" height="10" rx="2" class="mid" /><rect x="345" y="108" width="10" height="10" rx="2" class="high" />
    <rect x="360" y="93" width="10" height="10" rx="2" class="mid" /><rect x="375" y="138" width="10" height="10" rx="2" class="low" />
    <rect x="390" y="108" width="10" height="10" rx="2" class="high" /><rect x="405" y="123" width="10" height="10" rx="2" class="mid" />
    <rect x="420" y="93" width="10" height="10" rx="2" class="low" /><rect x="435" y="153" width="10" height="10" rx="2" class="mid" />
    <rect x="450" y="108" width="10" height="10" rx="2" class="high" /><rect x="465" y="123" width="10" height="10" rx="2" class="mid" />
    <rect x="480" y="138" width="10" height="10" rx="2" class="high" /><rect x="495" y="108" width="10" height="10" rx="2" class="low" />
    <rect x="510" y="93" width="10" height="10" rx="2" class="mid" /><rect x="525" y="123" width="10" height="10" rx="2" class="high" />
    <rect x="540" y="108" width="10" height="10" rx="2" class="mid" /><rect x="555" y="153" width="10" height="10" rx="2" class="low" />
    <rect x="585" y="93" width="10" height="10" rx="2" class="high" /><rect x="600" y="108" width="10" height="10" rx="2" class="mid" />
    <rect x="615" y="123" width="10" height="10" rx="2" class="high" /><rect x="630" y="138" width="10" height="10" rx="2" class="low" />
    <rect x="660" y="93" width="10" height="10" rx="2" class="mid" /><rect x="675" y="108" width="10" height="10" rx="2" class="high" />
    <rect x="690" y="123" width="10" height="10" rx="2" class="mid" /><rect x="705" y="138" width="10" height="10" rx="2" class="low" />
    <rect x="735" y="108" width="10" height="10" rx="2" class="mid" /><rect x="750" y="93" width="10" height="10" rx="2" class="high" />
    <rect x="765" y="123" width="10" height="10" rx="2" class="low" /><rect x="780" y="138" width="10" height="10" rx="2" class="mid" />
  </g>

  <g>
    <rect x="345" y="123" width="10" height="10" rx="2" class="hot pulse" /><rect x="525" y="123" width="10" height="10" rx="2" class="hot pulse-delay" /><rect x="675" y="108" width="10" height="10" rx="2" class="hot pulse-late" />
    <g class="burst" transform="translate(350 128)" stroke="#00ff66" stroke-width="1.5" filter="url(#glow)"><path d="M0-17V-9M0 9V17M-17 0H-9M9 0H17M-12-12L-7-7M12 12L7 7M12-12L7-7M-12 12L-7 7" /></g>
    <g class="burst-delay" transform="translate(680 113)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"><path d="M0-17V-9M0 9V17M-17 0H-9M9 0H17M-12-12L-7-7M12 12L7 7M12-12L7-7M-12 12L-7 7" /></g>
  </g>

  <g class="mono" font-size="10">
    <text x="75" y="212" fill="#8fb7a0">LESS</text>
    <rect x="115" y="202" width="10" height="10" rx="2" fill="#161b22" /><rect x="130" y="202" width="10" height="10" rx="2" class="low" /><rect x="145" y="202" width="10" height="10" rx="2" class="mid" /><rect x="160" y="202" width="10" height="10" rx="2" class="high" /><rect x="175" y="202" width="10" height="10" rx="2" class="hot" />
    <text x="198" y="212" fill="#8fb7a0">MORE</text>
    <text x="605" y="212" fill="#00e5ff">PIXEL BURSTS: ENABLED</text>
  </g>
</svg>
