<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

      .pixel-box {
        fill: #05080c;
        stroke: #00ff41;
        stroke-width: 2.5;
        shape-rendering: crispEdges;
      }
      .pixel-header-bg {
        fill: #00ff41;
        shape-rendering: crispEdges;
      }
      .pixel-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #05080c;
        font-weight: bold;
      }
      .pixel-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        fill: #00f0ff;
        letter-spacing: 1px;
      }
      .pixel-value {
        font-family: 'VT323', monospace;
        font-size: 21px;
        fill: #e6edf3;
        letter-spacing: 1px;
      }
      .pixel-accent {
        font-family: 'VT323', monospace;
        font-size: 21px;
        fill: #00ff41;
      }
      .cursor-blink {
        animation: blink 0.8s infinite steps(1);
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .pixel-corner {
        fill: #00f0ff;
        shape-rendering: crispEdges;
      }
    ]]></style>
  </defs>

  <!-- Outer Shadow -->
  <rect x="10" y="10" width="830" height="210" fill="#000000" opacity="0.6" shape-rendering="crispEdges" />

  <!-- Main Card Body -->
  <rect x="6" y="6" width="830" height="210" class="pixel-box" />

  <!-- Pixel Window Header Bar -->
  <rect x="6" y="6" width="830" height="28" class="pixel-header-bg" />
  
  <!-- Header Text -->
  <text x="20" y="25" class="pixel-title">👾 PLAYER_CARD.EXE :: RAFIUL_ALAM</text>
  
  <!-- Header Window Buttons -->
  <rect x="785" y="12" width="14" height="14" fill="#05080c" />
  <text x="789" y="23" font-family="'Press Start 2P', monospace" font-size="10" fill="#00ff41">_</text>
  <rect x="805" y="12" width="14" height="14" fill="#05080c" />
  <text x="809" y="24" font-family="'Press Start 2P', monospace" font-size="10" fill="#ff0055">X</text>

  <!-- Interior Pixel Corner Accents -->
  <rect x="12" y="40" width="6" height="6" class="pixel-corner" />
  <rect x="824" y="40" width="6" height="6" class="pixel-corner" />
  <rect x="12" y="202" width="6" height="6" class="pixel-corner" />
  <rect x="824" y="202" width="6" height="6" class="pixel-corner" />

  <!-- Left Column: Retro Avatar Box -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="145" height="150" fill="#030608" stroke="#00f0ff" stroke-width="1.5" shape-rendering="crispEdges" />
    
    <!-- Pixel Cyber Face Icon -->
    <g transform="translate(38, 20)">
      <rect x="15" y="0" width="40" height="12" fill="#00ff41" />
      <rect x="5" y="10" width="60" height="15" fill="#00ff41" />
      <rect x="10" y="25" width="50" height="35" fill="#00f0ff" opacity="0.3" />
      <rect x="5" y="32" width="60" height="14" fill="#00ff41" />
      <rect x="10" y="34" width="50" height="10" fill="#05080c" />
      <rect x="14" y="37" width="18" height="4" fill="#00f0ff" />
      <rect x="38" y="37" width="18" height="4" fill="#00f0ff" />
      <rect x="25" y="52" width="20" height="3" fill="#00ff41" />
    </g>

    <!-- LVL & CLASS BADGE -->
    <text x="72" y="112" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="8" fill="#00ff41">LVL 99 DEV</text>
    <rect x="15" y="122" width="115" height="16" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1" />
    <text x="72" y="134" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="7" fill="#00f0ff">ONLINE • 2026</text>
  </g>

  <!-- Right Column: Clean Scannable Profile Attributes -->
  <g transform="translate(200, 52)">
    <!-- Item 1: Name & Role -->
    <text x="0" y="20" class="pixel-label">NAME:</text>
    <text x="95" y="20" class="pixel-accent" font-size="22">RAFIUL ALAM</text>
    <text x="250" y="20" class="pixel-label" fill="#ff0055">[SOFTWARE / AI DEV]</text>

    <!-- Item 2: Core Domain -->
    <text x="0" y="52" class="pixel-label">CLASS:</text>
    <text x="95" y="52" class="pixel-value">AI Engineer &amp; Full-Stack Architect</text>

    <!-- Item 3: Focus & Specialties -->
    <text x="0" y="84" class="pixel-label">FOCUS:</text>
    <text x="95" y="84" class="pixel-value">Autonomous AI Agents • Gemini API • Next.js • Python</text>

    <!-- Item 4: Weapons / Stack -->
    <text x="0" y="116" class="pixel-label">WEAPONS:</text>
    <text x="95" y="116" class="pixel-value">TypeScript, Python, Flutter, React, Supabase, C++</text>

    <!-- Item 5: Cybersite & Status -->
    <text x="0" y="148" class="pixel-label">WEB:</text>
    <text x="95" y="148" class="pixel-accent">https://rafiulalam.xyz</text>
    <rect x="335" y="133" width="8" height="17" fill="#00ff41" class="cursor-blink" />
  </g>
</svg>
